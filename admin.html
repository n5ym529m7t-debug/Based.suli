<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Based Suli Stock</title>
<style>
:root{--bg:#0b0b0b;--card:#131313;--ink:#f2eee3;--muted:#9a968b;--bone:#d9c9a0;--line:#2a2a28;--ok:#3f8f5a;--no:#b2453d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:max(1rem,env(safe-area-inset-top)) 1rem 6rem}
h1{font-size:1.3rem;color:var(--bone);margin:.5rem 0 1rem}
.box{background:var(--card);border:1px solid var(--line);padding:1rem;margin-bottom:1rem;border-radius:6px}
input{width:100%;padding:.75rem;background:#000;color:var(--ink);border:1px solid var(--line);border-radius:6px;font:inherit;margin:.5rem 0}
button{font:inherit;border:0;border-radius:6px;padding:.7rem 1rem;cursor:pointer}
.gold{background:linear-gradient(90deg,#cdb872,#a8893a);color:#14110a;font-weight:600}
.link{background:none;color:var(--muted);text-decoration:underline;padding:.3rem 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line);gap:.6rem}
.row:last-child{border-bottom:0}
.tg{min-width:120px;color:#fff;font-weight:600}
.tg.in{background:var(--ok)}.tg.out{background:var(--no)}
#bar{position:fixed;left:0;right:0;bottom:0;background:#000;border-top:1px solid var(--line);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom))}
#bar button{width:100%}
#msg{color:var(--muted);text-align:center;margin:.5rem 0 0;min-height:1.4em}
.hide{display:none}
</style>
</head>
<body>
<h1>Based Suli – Stock</h1>

<div id="keybox" class="box hide">
  <strong>First time on this phone</strong>
  <p style="color:var(--muted);margin:.3rem 0">Paste your GitHub key once. It stays on this phone only.</p>
  <input id="key" type="password" placeholder="GitHub key" autocomplete="off">
  <button class="gold" id="savekey">Save key</button>
</div>

<div class="box"><div id="list">Loading…</div></div>
<button class="link hide" id="forget">Forget key on this phone</button>

<div id="bar"><button class="gold" id="save">Save changes</button><p id="msg"></p></div>

<script>
var OWNER = "n5ym529m7t-debug", REPO = "Based.suli", PATH = "stock.json";
var API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/" + PATH;
var FALLBACK = ["Shampoo","Conditioner","Hair Elixir","Texture Powder","Sea Salt Spray","Hair Clay","Pomade","Curl Mousse","Curl Gel","Curl Refresh Spray","Curl Cream","Leave-In Conditioner","Multi-Active Skin Elixir","Under Eye Elixir","Skin Revival Spray","Daily Facial Cleanser","Daily Facial Moisturizer"];
var names = [], out = [];
var $ = function (id) { return document.getElementById(id); };

function getKey() { try { return localStorage.getItem("bs_key") || ""; } catch (e) { return ""; } }
function setKey(v) { try { if (v) localStorage.setItem("bs_key", v); else localStorage.removeItem("bs_key"); } catch (e) {} }
function say(t) { $("msg").textContent = t; }

function showKeyState() {
  var has = !!getKey();
  $("keybox").classList.toggle("hide", has);
  $("forget").classList.toggle("hide", !has);
}

function draw() {
  $("list").innerHTML = "";
  names.forEach(function (n) {
    var isOut = out.indexOf(n) > -1;
    var row = document.createElement("div"); row.className = "row";
    var label = document.createElement("span"); label.textContent = n;
    var b = document.createElement("button");
    b.className = "tg " + (isOut ? "out" : "in");
    b.textContent = isOut ? "Out of stock" : "In stock";
    b.onclick = function () {
      var i = out.indexOf(n);
      if (i > -1) out.splice(i, 1); else out.push(n);
      draw();
    };
    row.appendChild(label); row.appendChild(b); $("list").appendChild(row);
  });
}

function load() {
  fetch("index.html?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.text(); })
    .then(function (t) {
      var re = /\{n:"([^"]+)"/g, m, found = [];
      while ((m = re.exec(t))) found.push(m[1]);
      names = found.length ? found : FALLBACK;
    })
    .catch(function () { names = FALLBACK; })
    .then(function () { return fetch("stock.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }); })
    .then(function (d) { out = d.out || []; })
    .catch(function () { out = []; })
    .then(draw);
}

function headers() {
  return { "Authorization": "Bearer " + getKey(), "Accept": "application/vnd.github+json" };
}

function save() {
  if (!getKey()) { showKeyState(); say("Add your GitHub key first."); return; }
  say("Saving…");
  fetch(API, { headers: headers(), cache: "no-store" })
    .then(function (r) {
      if (r.status === 401) throw new Error("bad key");
      return r.status === 404 ? {} : r.json();
    })
    .then(function (cur) {
      var json = JSON.stringify({ out: out }, null, 1) + "\n";
      var body = { message: "Update stock", content: btoa(unescape(encodeURIComponent(json))) };
      if (cur && cur.sha) body.sha = cur.sha;
      return fetch(API, { method: "PUT", headers: headers(), body: JSON.stringify(body) });
    })
    .then(function (r) {
      if (r.ok) say("Saved. The site updates in about a minute.");
      else if (r.status === 401 || r.status === 403 || r.status === 404) say("GitHub refused. Check your key lets you edit this repo.");
      else say("Could not save. Try again.");
    })
    .catch(function (e) {
      say(e.message === "bad key" ? "That key was not accepted. Tap Forget key and paste a new one." : "No connection. Try again.");
    });
}

$("savekey").onclick = function () {
  var v = $("key").value.trim();
  if (!v) return;
  setKey(v); $("key").value = ""; showKeyState(); say("Key saved on this phone.");
};
$("forget").onclick = function () { setKey(""); showKeyState(); say("Key removed from this phone."); };
$("save").onclick = save;

showKeyState();
load();
</script>
</body>
</html>
