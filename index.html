<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Based Suli</title>
  <script src=checkout.js defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --card:#131313; --ink:#f2eee3; --muted:#9a968b; --bone:#d9c9a0; --gold1:#cdb872; --gold2:#a8893a; --line:#2a2a28;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Unbounded,"Instrument Sans",system-ui,sans-serif;margin:0;line-height:1.08;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold1);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 1.25rem}
header{display:flex;justify-content:space-between;align-items:center;padding:1.1rem 0;border-bottom:1px solid var(--line)}
.logo{font:700 1.1rem Unbounded,sans-serif;text-decoration:none;color:var(--bone);letter-spacing:.02em}
nav{display:flex;align-items:center;gap:1.5rem}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}
.cart{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.4rem .9rem;font:inherit;cursor:pointer}
.hero{padding:4rem 0 3rem}
h1{font-size:clamp(2.2rem,7.5vw,5rem);max-width:15ch;color:var(--bone)}
.hero p{max-width:40ch;color:var(--muted);font-size:1.2rem;margin:1.25rem 0 2rem}
.gold{background:linear-gradient(90deg,var(--gold1),var(--gold2));color:#14110a;border:1px solid #4a4026;font-weight:600;text-decoration:none;cursor:pointer}
.gold:hover{filter:brightness(1.08)}
.banner{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.75rem}.banner img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.5rem}
.tab{background:none;border:1px solid var(--line);color:var(--muted);padding:.5rem 1rem;border-radius:999px;font:inherit;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--bone);color:#14110a;border-color:var(--bone)}
h2{font-size:clamp(1.5rem,4vw,2.2rem);margin-bottom:1.5rem}
.grid{display:grid;gap:1.1rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);padding:.9rem .9rem 1.1rem;display:flex;flex-direction:column}
.photo{aspect-ratio:3/4;background:radial-gradient(ellipse at 50% 20%,#262626,#050505 75%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;margin-bottom:1rem}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{height:80%;width:auto;margin-bottom:6%}
.card h3{font-size:1.15rem;font-weight:500;letter-spacing:0}
.tag{margin:.3rem 0 1rem;color:var(--muted);flex:1}
.price{font-size:1.5rem;font-weight:500;margin-bottom:1rem}
.price.empty{font-size:1rem;color:var(--muted)}
.add{display:flex;justify-content:space-between;align-items:center;width:100%;padding:.85rem 1rem;border-radius:2px;font:600 .95rem "Instrument Sans",sans-serif;letter-spacing:.03em}
.about{padding:4rem 0 5rem;border-top:1px solid var(--line);margin-top:3rem;display:grid;gap:2rem;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.about p{margin:0 0 1rem;color:var(--muted);max-width:50ch}
footer{border-top:1px solid var(--line);padding:2rem 0 3rem;color:var(--muted);font-size:.95rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
@media (max-width:560px){nav a{display:none}.grid{grid-template-columns:repeat(2,1fr);gap:.6rem}.card{padding:.5rem .5rem .8rem}.card h3{font-size:.95rem}.tag{font-size:.85rem;margin-bottom:.7rem}.price{font-size:1.05rem;margin-bottom:.7rem}.price.empty{font-size:.85rem}.add{padding:.65rem .6rem;font-size:.72rem}.add svg{width:16px;height:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#top">BASED SULI</a>
    <nav><a href="#shop">Shop</a><a href="#about">About</a><button class="cart" id="cart" aria-label="Cart">Cart (0)</button></nav>
  </header>

  <section class="hero" id="top">
    <h1>Let us reward you naturally</h1>
    <div class="banner" id="banner"></div>
  </section>

  <section id="shop">
    <h2>Shop</h2>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>
  </section>

  <section class="about" id="about">
    <h2>Natural, and nothing extra</h2>
    <div>
      <p>Based Suli sells natural care for hair and skin. Pick a product from the shop, or send us a message if you want help choosing.</p>
      <p>Instagram: <a href="https://instagram.com/based.suli" style="color:var(--bone)">@based.suli</a></p>
    </div>
  </section>

  <footer><span>© 2026 Based Suli</span><span>All natural</span></footer>
</div>

var cats=["All","Hair Care","Hair Styling","Skin"], cur="All", count=0;
var tabs=document.getElementById("tabs"), grid=document.getElementById("grid"), cartBtn=document.getElementById("cart");
var bag='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>';
function render(){
  tabs.innerHTML=cats.map(function(c){return '<button class="tab" data-c="'+c+'" aria-pressed="'+(c===cur)+'">'+c+'</button>';}).join("");
  grid.innerHTML=PRODUCTS.filter(function(p){return cur==="All"||p.c===cur;}).map(function(p){
    var price=p.p?'<div class="price">'+p.p+'</div>':'<div class="price empty">Price coming soon</div>';
    return '<article class="card"><div class="photo">'+(IMGS[p.n]?'<img src="'+IMGS[p.n]+'" alt="'+p.n+'" loading="lazy">':SHAPES[p.s])+'</div><h3>'+p.n+'</h3><p class="tag">'+p.t+'</p>'+price
      +'<button class="gold add"><span>ADD TO CART</span>'+bag+'</button></article>';
  }).join("");
}
tabs.addEventListener("click",function(e){var c=e.target.getAttribute("data-c");if(c){cur=c;render();}});
grid.addEventListener("click",function(e){if(e.target.closest(".add")){count++;cartBtn.textContent="Cart ("+count+")";}});
render();
document.getElementById("banner").innerHTML=["Multi-Active Skin Elixir","Shampoo","Pomade"].map(function(n){return '<img src="'+IMGS[n]+'" alt="'+n+'">';}).join("");
</script>
